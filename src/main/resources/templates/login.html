<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myhome 로그인</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="login-main">
    <div class="card">
        <h1>로그인</h1>
        <p class="subtitle">ESP32 에어컨 제어 &amp; AI 리포트</p>

        <div class="social-login">
            <a class="btn" href="/oauth2/authorization/google">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.4-.4-3.5z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3c-7.5 0-13.9 4.2-17.7 10.4z"/>
                    <path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36 26.9 37 24 37c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.9 40.6 16.4 45 24 45z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.5l6.6 5.4C41.5 35.9 45 30.5 45 24c0-1.4-.1-2.4-1.4-3.5z"/>
                </svg>
                Google로 계속하기
            </a>
        </div>

        <div class="divider">또는</div>

        <p class="note" th:if="${param.error}" style="color:#dc2626;">로그인에 실패했습니다. 다시 시도해주세요.</p>
        <p class="note" th:unless="${param.error}">추후 이메일 로그인이 추가될 수 있습니다.</p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
